      <h2>How does that become a carbon credit?</h2>
      <div class="answer">
        <p>A credit is one tonne of CO<sub>2</sub> kept out of the air.</p>

              <tr><td>As CO<sub>2</sub> equivalent, each year</td><td class="num">5.08</td></tr>
