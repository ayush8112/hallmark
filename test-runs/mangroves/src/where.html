  <section class="q" id="where">
    <div class="container">
      <h2>Wait, the carbon is in the mud?</h2>
      <div class="answer">
        <p>Yes. The soil runs half a metre to over three metres deep and holds most of it.</p>
        <div class="sheet">
          <svg class="chart" viewBox="0 0 1000 150" role="img" aria-labelledby="chart-title">
            <title id="chart-title">Share of mangrove carbon held in the soil: from 49 to 98 percent across the forests measured</title>
            <rect class="well" x="40" y="40" width="920" height="40"></rect>
            <rect class="series" x="490.8" y="40" width="450.8" height="40"></rect>
            <line class="axis" x1="40" y1="96" x2="960" y2="96"></line>
            <line class="tick" x1="40" y1="96" x2="40" y2="104"></line>
            <line class="tick" x1="500" y1="96" x2="500" y2="104"></line>
            <line class="tick" x1="960" y1="96" x2="960" y2="104"></line>
            <text x="40" y="124">0%</text>
            <text x="500" y="124" text-anchor="middle">50%</text>
            <text x="960" y="124" text-anchor="end">100%</text>
            <text class="mark" x="490.8" y="28">49%</text>

          <p class="figure-unit" style="font-size: var(--text-md)">Share of the carbon held in soil, lowest forest to highest.</p>
        </div>
      </div>
